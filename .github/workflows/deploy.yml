name: Build & Deploy to backend branch

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend → backend/public
        working-directory: frontend
        run: npm run build
        # vite.config.js outputs to ../backend/public

      - name: Push backend folder to `backend` branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Orphan checkout of the target branch
          git fetch origin backend --depth=1 || true
          git checkout --orphan backend-tmp

          # Keep only the backend folder content at the repo root
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'backend' \
            ! -name '.git' \
            -exec rm -rf {} +

          # Move backend contents up to repo root
          shopt -s dotglob
          mv backend/* .
          rm -rf backend

          # Stage everything
          git add -A
          git commit -m "deploy: build from ${GITHUB_SHA::7}"

          # Force-push to the backend branch
          git push origin backend-tmp:backend --force
